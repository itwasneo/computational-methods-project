name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    # Required by master branch protection: never path-filter this job.
    name: Python checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      browser: ${{ steps.scope.outputs.browser }}
    env:
      UV_NO_CONFIG: "1"
      UV_PYTHON: "3.12"
      UV_PYTHON_DOWNLOADS: never
      PYTHONNOUSERSITE: "1"
      NUMBA_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select relevant frontend checks
        id: scope
        run: python3 .github/ci_scope.py
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          architecture: x64
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.4"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            .python-version
          cache-local-path: ${{ runner.temp }}/uv-cache
      - name: Install locked environment
        run: uv sync --locked --extra interface
      - name: Run correctness tests
        env:
          NUMBA_CACHE_DIR: ${{ runner.temp }}/numba-cache
        run: uv run --locked --extra interface pytest -W error
      - name: Build package distributions
        run: uv build --no-sources

  frontend:
    needs: python-checks
    if: needs.python-checks.outputs.frontend == 'true' || needs.python-checks.outputs.browser == 'true'
    name: ${{ needs.python-checks.outputs.browser == 'true' && format('Browser checks ({0})', matrix.browser) || 'Frontend checks' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["chromium","firefox","webkit"]' || '["chromium"]') }}
    env:
      UV_NO_CONFIG: "1"
      NUMBA_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TSP_UI_BROWSER: ${{ matrix.browser }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.14.0"
          package-manager-cache: false
      - name: Install frontend dependencies
        run: |
          npm install --global pnpm@10.32.1 --ignore-scripts
          pnpm --dir frontend install --frozen-lockfile
      - name: Check, lint, format, unit test and build
        if: matrix.browser == 'chromium' && needs.python-checks.outputs.frontend == 'true'
        run: |
          pnpm --dir frontend run check
          pnpm --dir frontend run lint
          pnpm --dir frontend run format:check
          pnpm --dir frontend run test
          pnpm --dir frontend run build
      - name: Set up Python
        if: needs.python-checks.outputs.browser == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Set up uv
        if: needs.python-checks.outputs.browser == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.4"
      - name: Install browser and test dependencies
        if: needs.python-checks.outputs.browser == 'true'
        run: |
          uv sync --locked --extra interface
          uv run --locked python -m playwright install --with-deps "$TSP_UI_BROWSER"
      - name: Test mounted UI interactions
        if: needs.python-checks.outputs.browser == 'true'
        run: uv run --locked --extra interface pytest frontend/ui_tests -q -W error
      # Separate pytest processes: release the interaction fixtures before the native tests.
      - name: Test real browser, API and native worker together
        if: matrix.browser == 'chromium' && needs.python-checks.outputs.browser == 'true'
        run: uv run --locked --extra interface pytest frontend/acceptance -q -W error
