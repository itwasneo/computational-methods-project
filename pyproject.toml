[project]
name = "tsp-hpc"
version = "0.1.0"
description = "TSP heuristic experiments with compiled Python kernels and controlled HPC execution"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numba>=0.68.1,<0.69",
    "numpy>=2.5.4,<2.6",
]

[project.scripts]
tsp-hpc = "tsp_hpc.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
]
analysis = [
    "matplotlib>=3.11.2,<3.12",
    "pandas>=3.1,<3.2",
]

[build-system]
requires = ["uv_build==0.10.4"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
